<header class="instructor-header">
  <div class="header-left">
    <button class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
      <span class="material-icons">{{ sidebarOpen ? 'close' : 'menu' }}</span>
    </button>
    <div class="header-title-group">
      <h1 class="header-title">{{ pageTitle }}</h1>
      <p class="header-subtitle">Welcome back, {{ userName }}</p>
    </div>
  </div>

  <div class="header-right">
    <button
      class="icon-btn notif-trigger"
      type="button"
      aria-label="Notifications"
      [attr.aria-expanded]="notificationMenuOpen"
      [class.active]="notificationMenuOpen"
      (click)="toggleNotificationMenu($event)"
    >
      <span class="material-icons">notifications</span>
      <span class="notif-badge" *ngIf="unreadCount() > 0" aria-hidden="true">
        {{ unreadCount() > 9 ? '9+' : unreadCount() }}
      </span>
    </button>
    <button class="avatar-btn" aria-label="Account" (click)="toggleProfileMenu($event)">
      {{ userInitial }}
    </button>

    <div class="menu-panel notif-menu" *ngIf="notificationMenuOpen" (click)="$event.stopPropagation()">
      <app-notification-panel [role]="notificationRole" />
    </div>

    <div class="menu-panel profile-menu" *ngIf="profileMenuOpen" (click)="$event.stopPropagation()">
      <button type="button" class="menu-item" (click)="navigateTo('/instructor/account', $event)">
        <span class="material-icons">person</span>
        <span>Account</span>
      </button>
      <button type="button" class="menu-item" (click)="navigateTo('/instructor/settings', $event)">
        <span class="material-icons">settings</span>
        <span>Settings</span>
      </button>
      <button type="button" class="menu-item" (click)="toggleTheme($event)">
        <span class="material-icons">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
        <span>{{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}</span>
      </button>
      <button type="button" class="menu-item danger" (click)="logout($event)">
        <span class="material-icons">logout</span>
        <span>Sign out</span>
      </button>
    </div>
  </div>
</header>
